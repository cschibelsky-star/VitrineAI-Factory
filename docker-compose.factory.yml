services:
  factory:
    build:
      context: .
      dockerfile: factory-runtime/Dockerfile
    container_name: vitrine_factory_hml
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/database.sqlite
    ports:
      - "8080:8080"
    volumes:
      - factory_storage:/app/storage
      - factory_database:/app/database

volumes:
  factory_storage:
  factory_database:
