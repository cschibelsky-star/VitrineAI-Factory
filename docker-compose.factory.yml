services:
  factory:
    build:
      context: .
      dockerfile: factory-runtime/Dockerfile
    container_name: vitrine_factory_hml
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      APP_KEY: ${FACTORY_APP_KEY:-}
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/storage/app/factory.sqlite
      # Empty until a server-side managed credential is provisioned; endpoint fails closed.
      FACTORY_VIA_READ_TOKEN: ${FACTORY_VIA_READ_TOKEN:-}
      FACTORY_BOOTSTRAP_MODE: ${FACTORY_BOOTSTRAP_MODE:-disabled}
      CI: ${FACTORY_CI_FLAG:-false}
      FACTORY_ADMIN_NAME: ${FACTORY_ADMIN_NAME:-Factory Admin}
      FACTORY_ADMIN_EMAIL: ${FACTORY_ADMIN_EMAIL:-}
      FACTORY_ADMIN_PASSWORD: ${FACTORY_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - factory_storage:/app/storage

volumes:
  factory_storage:
