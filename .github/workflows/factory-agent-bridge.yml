name: Factory Agent Bridge

on:
  pull_request:
    paths:
      - 'factory-agent-bridge/**'
      - '.github/workflows/factory-agent-bridge.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r factory-agent-bridge/requirements.txt
      - name: Compile Python
        run: python -m compileall factory-agent-bridge/src
      - name: Run policy tests
        run: pytest -q factory-agent-bridge/tests
