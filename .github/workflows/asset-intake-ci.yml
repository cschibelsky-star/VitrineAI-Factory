name: Factory Asset Intake CI
on:
  pull_request:
    paths:
      - "docker-compose.asset-validation.yml"
      - "tools/validation/**"
      - "tools/asset_ingest.py"
      - "tools/asset_job.py"
      - "tools/asset_intake.py"
      - "tools/asset_reference_store.py"
      - "tools/asset_runtime.py"
      - "tools/asset_fastmcp.py"
      - "tools/tests/test_asset_fastmcp.py"
      - "tools/sdk_tests/**"
      - "tools/tests/test_asset_runtime.py"
      - "tools/tests/test_asset_reference_store.py"
      - "tools/tests/test_asset_intake.py"
      - "tools/tests/test_asset_job.py"
      - "tools/asset_manifest_verify.py"
      - "tools/tests/test_asset_ingest.py"
      - "tools/tests/test_asset_manifest_verify.py"
      - ".github/workflows/asset-intake-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  asset-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m py_compile tools/asset_ingest.py tools/asset_manifest_verify.py tools/asset_job.py tools/asset_intake.py tools/asset_reference_store.py tools/asset_runtime.py tools/asset_fastmcp.py
      - name: Safe import tests
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v

  authenticated-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated SDK test dependencies
        run: python -m pip install 'fastmcp==2.10.6' 'mcp==1.12.4' 'pydantic==2.11.7' 'pydantic-settings==2.10.1' 'starlette==0.47.2' 'sse-starlette==2.4.1'
      - name: Real HTTP authentication and binary intake
        run: python -m unittest discover -s tools/sdk_tests -p 'test_*.py' -v
  isolated-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated runner configuration
        run: docker compose -f docker-compose.asset-validation.yml config --quiet
      - name: Build disposable test image
        run: docker compose -f docker-compose.asset-validation.yml build asset-validation
      - name: Run without network, privileges or host mounts
        run: docker compose -f docker-compose.asset-validation.yml run --rm asset-validation
      - name: Build isolated Asset Host image
        run: docker build -f tools/validation/AssetHost.Dockerfile -t factory-asset-host-ci:latest .
      - name: Verify non-root private state directory
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python factory-asset-host-ci:latest -c 'import os, pathlib; p=pathlib.Path("/var/lib/asset-intake"); s=p.stat(); assert s.st_uid == os.geteuid() == 65534; assert s.st_mode & 0o077 == 0; print("private state ownership: PASS")'

